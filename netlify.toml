[build]
  command   = "npm run build"
  publish   = "dist"

[dev]
  command    = "npm run dev"
  port       = 8888
  targetPort = 3000
  framework  = "#custom"

[functions]
  directory = "netlify/functions"

# -- Force www canonical domain (301 redirect) --------------------------------
# Netlify handles HTTP->HTTPS automatically (no rule needed for that).
# This rule ensures alzaydaninternational.com/* redirects to www.
[[redirects]]
  from   = "https://alzaydaninternational.com/*"
  to     = "https://www.alzaydaninternational.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "/api/parse-product-ai"
  to     = "/.netlify/functions/parse-product-ai"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/upload-to-r2"
  to     = "/.netlify/functions/upload-to-r2"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/get-ip"
  to     = "/.netlify/functions/get-ip"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/sync-sheet-product"
  to     = "/.netlify/functions/sync-sheet-product"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/add-product-to-sheet"
  to     = "/.netlify/functions/add-product-to-sheet"
  status = 200
  force  = true

# -- Dynamic Sitemap via Netlify Function ------------------------------------
# Must come BEFORE the SPA catch-all redirect below
[[redirects]]
  from   = "/sitemap.xml"
  to     = "/.netlify/functions/sitemap?type=index"
  status = 200
  force  = true

# -- Sub-sitemaps: served as static XML files (no force redirect) -------------
# Static files in public/ are copied to dist/ at build time.
# Netlify serves static files before checking redirects (when force=true is absent).
# The Netlify function is a fallback ONLY if the static file doesn't exist.
[[redirects]]
  from   = "/sitemap-products.xml"
  to     = "/.netlify/functions/sitemap?type=products"
  status = 200

[[redirects]]
  from   = "/sitemap-products-:num.xml"
  to     = "/.netlify/functions/sitemap?type=products&num=:num"
  status = 200

[[redirects]]
  from   = "/sitemap-categories.xml"
  to     = "/.netlify/functions/sitemap?type=categories"
  status = 200

[[redirects]]
  from   = "/sitemap-pages.xml"
  to     = "/.netlify/functions/sitemap?type=pages"
  status = 200

[[redirects]]
  from   = "/sitemap-blogs.xml"
  to     = "/.netlify/functions/sitemap?type=blogs"
  status = 200

# -- Pre-rendered static HTML pages (product & static routes) -----------------
# These rules serve the static HTML files generated by scripts/prerender.cjs.
# They MUST come before the SPA catch-all redirect below.
# Netlify automatically serves /product/:id/index.html if the directory exists
# without these rules — but explicit rules ensure correct status codes.

[[redirects]]
  from   = "/product/:id"
  to     = "/product/:id/index.html"
  status = 200

[[redirects]]
  from   = "/category/:slug"
  to     = "/category/:slug/index.html"
  status = 200

[[redirects]]
  from   = "/about"
  to     = "/about/index.html"
  status = 200

[[redirects]]
  from   = "/contact"
  to     = "/contact/index.html"
  status = 200

[[redirects]]
  from   = "/rfq"
  to     = "/rfq/index.html"
  status = 200

[[redirects]]
  from   = "/blog"
  to     = "/blog/index.html"
  status = 200

[[redirects]]
  from   = "/search"
  to     = "/search/index.html"
  status = 200

[[redirects]]
  from   = "/solutions"
  to     = "/solutions/index.html"
  status = 200

[[redirects]]
  from   = "/traffic-safety-equipment-uae"
  to     = "/traffic-safety-equipment-uae/index.html"
  status = 200

[[redirects]]
  from   = "/road-safety-products-uae"
  to     = "/road-safety-products-uae/index.html"
  status = 200

[[redirects]]
  from   = "/reflective-sheeting-uae"
  to     = "/reflective-sheeting-uae/index.html"
  status = 200

[[redirects]]
  from   = "/packaging-materials-supplier-uae"
  to     = "/packaging-materials-supplier-uae/index.html"
  status = 200

# -- Dynamic sitemap and page routes are handled above. SPA fallback is generated in dist/_redirects at build-time.

# -- HTTP Headers for GEO & Security -----------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Language          = "en-AE"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "SAMEORIGIN"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://translate.google.com https://translate.googleapis.com; style-src 'self' 'unsafe-inline' https://translate.googleapis.com; img-src 'self' data: blob: https: https://pub-7ee997edc0944df3b82d8c4cec4131a1.r2.dev https://images.unsplash.com https://picsum.photos https://*.picsum.photos https://www.googletagmanager.com https://www.google-analytics.com https://translate.google.com https://translate.googleapis.com https://img.youtube.com https://www.transparenttextures.com; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.emailjs.com https://www.google-analytics.com https://translate.googleapis.com; frame-src 'self' https://www.googletagmanager.com https://www.youtube.com https://youtube.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self';"

# -- Sitemap caching headers --------------------------------------------------
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap-products.xml"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap-categories.xml"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap-pages.xml"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap-blogs.xml"
  [headers.values]
    Cache-Control = "public, s-maxage=3600, stale-while-revalidate=86400"

# -- Asset Caching for Performance -------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/**/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
